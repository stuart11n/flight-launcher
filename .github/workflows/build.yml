name: Build

on:
  push:
    branches: [master, main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Resolve version from tag
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -match '^v(?<ver>\d+\.\d+\.\d+)') {
            $ver = $Matches.ver
          } else {
            $ver = "1.0.0"
          }
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Installer version: $ver"

      - name: Restore
        run: dotnet restore .\SimpitLauncher.csproj -p:Platform=x64

      - name: Build
        run: dotnet build .\SimpitLauncher.csproj -c Release -p:Platform=x64 --no-restore

      - name: Publish self-contained (win-x64)
        run: |
          powershell -ExecutionPolicy Bypass -File .\publish.ps1 -Configuration Release

      - name: Upload publish folder
        uses: actions/upload-artifact@v4
        with:
          name: SimpitLauncher-win-x64
          path: artifacts/publish/win-x64
          if-no-files-found: error

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\SimpitLauncher.iss /DMyAppVersion=%VERSION%
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SimpitLauncherSetup
          path: artifacts/installer/SimpitLauncherSetup.exe
          if-no-files-found: error

      - name: Zip publish folder for release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts\publish\win-x64\* `
            -DestinationPath artifacts\SimpitLauncher-win-x64.zip -Force

      - name: Create draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          name: Simpit Launcher ${{ github.ref_name }}
          files: |
            artifacts/installer/SimpitLauncherSetup.exe
            artifacts/SimpitLauncher-win-x64.zip
